<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kontaktní formulář</title>
</head>
<body>
  <h1>Kontaktní formulář</h1>

  <form id="contactForm" action="send.php" method="post">
    <div>
      <label for="name">Jméno *</label><br>
      <input type="text" id="name" name="name" required>
    </div>

    <div>
      <label for="email">E-mail *</label><br>
      <input type="email" id="email" name="email" required>
    </div>

    <div>
      <label for="message">Zpráva</label><br>
      <textarea id="message" name="message" rows="5"></textarea>
    </div>

    <div>
      <button type="submit">Odeslat zprávu</button>
    </div>
  </form>

  <p id="formStatus" role="status"></p>

  <script>
    const form = document.getElementById('contactForm');
    const statusEl = document.getElementById('formStatus');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      statusEl.textContent = 'Odesílám...';

      try {
        const response = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
        });
        const result = await response.json();

        statusEl.textContent = result.message || 'Hotovo.';

        if (result.status === 'success') {
          form.reset();
        }
      } catch (error) {
        statusEl.textContent = 'Odeslání se nepodařilo. Zkuste to prosím znovu.';
      }
    });
  </script>
</body>
</html>
